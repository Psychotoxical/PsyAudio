[package]
name = "psyaudio"
version = "1.0.0"
edition = "2021"
description = "PsyAudio - audio converter, batch converter, CD ripper and tag editor"

[[bin]]
name = "PsyAudio"
path = "src/main.rs"

[dependencies]
eframe = "=0.31.1"
symphonia = { version = "0.5.5", features = ["all"] }
lofty = "0.24"
rfd = "0.16"
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
base64 = "0.22"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
egui-phosphor = "=0.9.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Power",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 2
incremental = false
