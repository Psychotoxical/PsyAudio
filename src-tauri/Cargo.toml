[package]
name = "psyaudio"
description = "PsyAudio desktop app (Tauri)"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "psyaudio_lib"
crate-type = ["rlib"]

[[bin]]
name = "PsyAudio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
psyaudio-core = { path = "../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-single-instance = "2.4.5"
