name: Packages

# Builds every package once. Called by the CI when a pull request changes the packaging, by
# the channel workflow for a release candidate or a release, and by hand. Every job uploads its
# files as an artifact whose name starts with "pkg-"; the channel workflow puts all files of
# those artifacts into the draft. The file names match .github/release/downloads.md.
on:
  workflow_call:
    inputs:
      ref:
        description: Branch, tag or commit to build
        type: string
        default: ""
      signed:
        description: macOS disk image must be signed and notarized (fails without the Apple secrets)
        type: boolean
        default: false
      file_version:
        description: Version in the file names, e.g. 1.2.0-rc.1 (empty = the version in package.json)
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build (empty = the chosen branch)
        type: string
        default: ""
      signed:
        description: macOS disk image must be signed and notarized (fails without the Apple secrets)
        type: boolean
        default: false
      file_version:
        description: Version in the file names, e.g. 1.2.0-rc.1 (empty = the version in package.json)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # The FFmpeg every package ships, built from source once per system and kept in the cache
  # until packaging/build_ffmpeg.sh changes.
  ffmpeg:
    name: ffmpeg (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux, script: linux, runner: ubuntu-22.04 }
          - { target: windows, script: windows, runner: ubuntu-22.04 }
          - { target: macos-x86_64, script: macos, runner: macos-15-intel }
          - { target: macos-arm64, script: macos, runner: macos-15 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - id: cache
        uses: actions/cache@v6
        with:
          path: ffmpeg-out
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('packaging/build_ffmpeg.sh') }}
      - name: Build tools
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm mingw-w64 pkg-config
      - name: Build tools (macOS)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
        run: brew install nasm pkgconf
      - name: Build FFmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash packaging/build_ffmpeg.sh ${{ matrix.script }} ffmpeg-out
      - name: Check FFmpeg
        if: matrix.target != 'windows'
        run: bash packaging/check_ffmpeg.sh ffmpeg-out/bin/ffmpeg
      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-${{ matrix.target }}
          path: ffmpeg-out
          if-no-files-found: error

  build:
    name: ${{ matrix.name }}
    needs: ffmpeg
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest supported Ubuntu, so the AppImage runs on older systems too
          - { name: linux, runner: ubuntu-22.04, bundles: "appimage,deb,rpm", target: "" }
          - { name: windows, runner: windows-latest, bundles: nsis, target: "" }
          # one disk image for Apple Silicon and Intel
          - { name: macos, runner: macos-15, bundles: dmg, target: universal-apple-darwin }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm

      - name: Shipped FFmpeg
        if: matrix.name != 'macos'
        uses: actions/download-artifact@v8
        with:
          name: ffmpeg-${{ matrix.name }}
          path: src-tauri/ffmpeg
      - name: Shipped FFmpeg (macOS, Intel)
        if: matrix.name == 'macos'
        uses: actions/download-artifact@v8
        with:
          name: ffmpeg-macos-x86_64
          path: ffmpeg-x86_64
      - name: Shipped FFmpeg (macOS, Apple Silicon)
        if: matrix.name == 'macos'
        uses: actions/download-artifact@v8
        with:
          name: ffmpeg-macos-arm64
          path: ffmpeg-arm64

      # Windows and Linux: a resource folder "ffmpeg" beside the app. macOS: external binaries in
      # Contents/MacOS, which Tauri signs; one universal file from both builds.
      - name: Put the shipped FFmpeg in place
        shell: bash
        env:
          NAME: ${{ matrix.name }}
        run: |
          if [ "$NAME" = macos ]; then
            mkdir -p src-tauri/ffmpeg/bin
            cp -R ffmpeg-arm64/licenses src-tauri/ffmpeg/
            for p in ffmpeg ffprobe; do
              cp "ffmpeg-x86_64/bin/$p" "src-tauri/ffmpeg/bin/$p-x86_64-apple-darwin"
              cp "ffmpeg-arm64/bin/$p" "src-tauri/ffmpeg/bin/$p-aarch64-apple-darwin"
              lipo -create "ffmpeg-x86_64/bin/$p" "ffmpeg-arm64/bin/$p" -output "src-tauri/ffmpeg/bin/$p-universal-apple-darwin"
            done
            echo "FFMPEG_CONFIG=packaging/tauri-ffmpeg-macos.json" >> "$GITHUB_ENV"
          else
            echo "FFMPEG_CONFIG=packaging/tauri-ffmpeg.json" >> "$GITHUB_ENV"
          fi
          chmod +x src-tauri/ffmpeg/bin/*
          ls -lR src-tauri/ffmpeg

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: packages

      - name: Install frontend dependencies
        run: npm ci

      # Developer ID signing and notarization by Tauri itself. Without the secrets (a pull request
      # from a fork) the disk image is signed ad hoc; a release or release candidate fails instead.
      - name: Apple signing
        if: matrix.name == 'macos'
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          SIGNED: ${{ inputs.signed }}
        run: |
          if [ -z "$CERT" ] || [ -z "$IDENTITY" ] || [ -z "$API_KEY_B64" ]; then
            if [ "$SIGNED" = "true" ]; then
              echo "::error::The Apple secrets are missing: a release disk image must be signed and notarized."
              exit 1
            fi
            echo "::notice::No Apple secrets: the disk image is signed ad hoc."
            exit 0
          fi
          printf '%s' "$API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "APPLE_CERTIFICATE=$CERT"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
            echo "APPLE_API_KEY=$API_KEY"
            echo "APPLE_API_ISSUER=$API_ISSUER"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            echo "MAC_SIGNED=1"
          } >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
          TARGET: ${{ matrix.target }}
        run: |
          args=(--bundles "$BUNDLES" --config "$FFMPEG_CONFIG")
          if [ -n "$TARGET" ]; then
            args+=(--target "$TARGET")
          fi
          npx tauri build "${args[@]}"

      - name: Collect the files
        shell: bash
        env:
          NAME: ${{ matrix.name }}
          TARGET: ${{ matrix.target }}
          FILE_VERSION: ${{ inputs.file_version }}
        run: |
          version=${FILE_VERSION:-$(node -p "require('./package.json').version")}
          bundle="target/${TARGET:+$TARGET/}release/bundle"
          mkdir out
          shopt -s nullglob
          one() {
            local files=("$1"/*"$2")
            if [ ${#files[@]} != 1 ]; then
              echo "::error::expected one $2 in $1, found ${#files[@]}"
              exit 1
            fi
            cp "${files[0]}" "out/$3"
          }
          case "$NAME" in
            linux)
              one "$bundle/appimage" .AppImage "PsyAudio-$version-x86_64.AppImage"
              one "$bundle/deb" .deb "psyaudio_${version}_amd64.deb"
              one "$bundle/rpm" .rpm "psyaudio-$version-1.x86_64.rpm"
              ;;
            windows)
              one "$bundle/nsis" -setup.exe "PsyAudio-Setup-$version.exe"
              ;;
            macos)
              one "$bundle/dmg" .dmg "PsyAudio-$version-macOS.dmg"
              ;;
          esac
          ls -l out

      # The shipped FFmpeg: inside every package, outside /usr/bin, starts and can do everything
      - name: Check the shipped FFmpeg (Linux)
        if: matrix.name == 'linux'
        shell: bash
        run: |
          dpkg-deb -c out/*.deb > deb.txt
          rpm -qlpv out/*.rpm > rpm.txt
          grep -E 'ff(mpeg|probe)' deb.txt rpm.txt
          if grep -E 'usr/bin/ff' deb.txt rpm.txt; then
            echo "::error::A Linux package puts FFmpeg into /usr/bin"
            exit 1
          fi
          grep -qE '^-rwxr-xr-x .*/ffmpeg/ffmpeg$' deb.txt
          grep -qE '^-rwxr-xr-x .*/ffmpeg/ffmpeg$' rpm.txt
          appimage=$(ls "$PWD"/out/*.AppImage)
          chmod +x "$appimage"
          (cd "$RUNNER_TEMP" && "$appimage" --appimage-extract > /dev/null)
          ff=$(find "$RUNNER_TEMP/squashfs-root" -path '*/ffmpeg/ffmpeg' -type f | head -n 1)
          echo "AppImage: $ff"
          bash packaging/check_ffmpeg.sh "$ff"
      - name: Every format with the shipped FFmpeg (Linux)
        if: matrix.name == 'linux'
        shell: bash
        run: PSYAUDIO_TEST_FFMPEG="$PWD/src-tauri/ffmpeg/bin/ffmpeg" cargo test -p psyaudio-core convert_all_formats -- --nocapture
      - name: Install the package (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $setup = Get-Item out/*.exe
          $dir = "$env:RUNNER_TEMP\psyaudio-test"
          $p = Start-Process $setup.FullName -ArgumentList "/S", "/D=$dir" -Wait -PassThru
          if ($p.ExitCode) { throw "Installation: $($p.ExitCode)" }
          Get-ChildItem -Recurse "$dir\ffmpeg" | Select-Object FullName, Length
      - name: Check the shipped FFmpeg (Windows)
        if: matrix.name == 'windows'
        shell: bash
        run: bash packaging/check_ffmpeg.sh "$(cygpath -u "$RUNNER_TEMP")/psyaudio-test/ffmpeg/ffmpeg.exe"
      - name: Uninstall the package (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $u = Start-Process "$env:RUNNER_TEMP\psyaudio-test\uninstall.exe" -ArgumentList "/S" -Wait -PassThru
          if ($u.ExitCode) { throw "Uninstall: $($u.ExitCode)" }
      - name: Check the shipped FFmpeg (macOS)
        if: matrix.name == 'macos'
        shell: bash
        run: |
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" out/*.dmg
          ff="$mnt/PsyAudio.app/Contents/MacOS/ffmpeg"
          lipo -archs "$ff"
          for arch in x86_64 arm64; do lipo -archs "$ff" | grep -qw "$arch"; done
          lipo -archs "$mnt/PsyAudio.app/Contents/MacOS/ffprobe" | grep -qw x86_64
          bash packaging/check_ffmpeg.sh "$ff"
          ls "$mnt/PsyAudio.app/Contents/Resources/ffmpeg-licenses"
          hdiutil detach "$mnt"

      - name: Check the signature
        if: matrix.name == 'macos' && env.MAC_SIGNED == '1'
        shell: bash
        run: |
          dmg=$(ls out/*.dmg)
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          codesign --verify --deep --strict --verbose=2 "$mnt/PsyAudio.app"
          spctl --assess --type execute --verbose=4 "$mnt/PsyAudio.app"
          xcrun stapler validate "$mnt/PsyAudio.app"
          hdiutil detach "$mnt"

      - uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
