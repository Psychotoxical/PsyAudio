[package]
name = "psyaudio-egui"
description = "PsyAudio egui interface (replaced by the Tauri interface)"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "PsyAudio-egui"
path = "src/main.rs"

[dependencies]
psyaudio-core = { path = "../crates/core" }
eframe = "=0.31.1"
rfd = "0.16"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
egui-phosphor = "=0.9.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Power",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
